```yaml
openapi: 3.1.0

info:
  title: Digital Certificates API
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:

  /certificate-types:
    get:
      summary: Get certificate types
      operationId: getCertificateTypes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateType'
              example:
                - certificateTypeId: ENROLLMENT
                  name: Certificate of Enrollment
                - certificateTypeId: TRANSCRIPT
                  name: Academic Transcript

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHORIZED
                message: Authentication is required.

  /certificate-requests:
    post:
      summary: Create certificate request
      operationId: createCertificateRequest

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateRequest'
            example:
              certificateTypeId: ENROLLMENT

      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRequest'
              example:
                requestId: req_12345
                certificateTypeId: ENROLLMENT
                status: COMPLETED
                processingRoute: AUTOMATED
                createdAt: '2026-10-22T08:30:00Z'
                completedAt: '2026-10-22T08:30:05Z'
                documentUrl: /api/v1/certificate-requests/req_12345/document

        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRequest'
              example:
                requestId: req_12346
                certificateTypeId: ENROLLMENT
                status: MANUAL_REVIEW_REQUIRED
                processingRoute: MANUAL
                manualRoutingReason: NO_ACTIVE_TEMPLATE
                createdAt: '2026-10-22T08:30:00Z'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Certificate type is required.
                fieldErrors:
                  - field: certificateTypeId
                    message: This field is required.

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_CERTIFICATE_TYPE
                message: The selected certificate type is unavailable.

  /certificate-requests/{requestId}:
    get:
      summary: Get certificate request
      operationId: getCertificateRequest

      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          example: req_12345

      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRequest'
              example:
                requestId: req_12345
                certificateTypeId: ENROLLMENT
                status: COMPLETED
                processingRoute: AUTOMATED
                createdAt: '2026-10-22T08:30:00Z'
                completedAt: '2026-10-22T08:30:05Z'
                documentUrl: /api/v1/certificate-requests/req_12345/document

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_NOT_FOUND
                message: The certificate request was not found.

  /certificate-requests/{requestId}/document:
    get:
      summary: Download certificate PDF
      operationId: downloadCertificate

      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          example: req_12345

      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DOCUMENT_NOT_READY
                message: The certificate is not yet available.

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:

    CertificateType:
      type: object
      additionalProperties: false
      required:
        - certificateTypeId
        - name
      properties:
        certificateTypeId:
          type: string
          example: ENROLLMENT
        name:
          type: string
          example: Certificate of Enrollment

    CreateCertificateRequest:
      type: object
      additionalProperties: false
      required:
        - certificateTypeId
      properties:
        certificateTypeId:
          type: string
          minLength: 1
          example: ENROLLMENT

    CertificateRequest:
      type: object
      required:
        - requestId
        - certificateTypeId
        - status
        - processingRoute
        - createdAt
      properties:
        requestId:
          type: string
          example: req_12345

        certificateTypeId:
          type: string
          example: ENROLLMENT

        status:
          type: string
          enum:
            - SUBMITTED
            - PROCESSING
            - MANUAL_REVIEW_REQUIRED
            - COMPLETED
            - FAILED
          example: COMPLETED

        processingRoute:
          type: string
          enum:
            - AUTOMATED
            - MANUAL
          example: AUTOMATED

        manualRoutingReason:
          type: string
          enum:
            - NO_ACTIVE_TEMPLATE
            - AMBIGUOUS_TEMPLATE_MAPPING

        createdAt:
          type: string
          format: date-time
          example: '2026-10-22T08:30:00Z'

        completedAt:
          type: string
          format: date-time
          example: '2026-10-22T08:30:05Z'

        documentUrl:
          type: string
          format: uri-reference
          example: /api/v1/certificate-requests/req_12345/document

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR

        message:
          type: string
          example: Certificate type is required.

        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

        correlationId:
          type: string

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: certificateTypeId

        message:
          type: string
          example: This field is required.
```
